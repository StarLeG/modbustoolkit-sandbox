# TASK-902: nginx перед Modbus-TCP сервером.
#
#   http   :80  -> app:8765  (web UI, REST, WebSocket /ws/state)
#   stream :5020 -> app:5020 (Modbus-TCP, сырой TCP)
#
# Запуск вместе с приложением: docker compose -f docker-compose.yml \
#   -f docker-compose.proxy.yml up -d
#
# Ограничение stream-проксирования: Modbus-лимиты по IP (MODBUS_MAX_CONN_PER_IP)
# видят адрес nginx-контейнера, а не реального клиента - сырым TCP заголовок
# не передать. HTTP-лимиты корректны: uvicorn читает X-Forwarded-For
# (см. FORWARDED_ALLOW_IPS).

worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

# Modbus-TCP: отдельный stream-блок, трафик не модифицируется.
stream {
    upstream modbus_backend {
        server app:5020;
    }

    server {
        listen 5020;
        proxy_pass modbus_backend;
        proxy_connect_timeout 5s;
        # Долгие Modbus-сессии наладчиков не должны рваться по idle.
        proxy_timeout 1h;
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 1m;

    # WebSocket: заголовок Connection должен следовать за Upgrade,
    # пустое значение - обычный HTTP, close.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream web_backend {
        server app:8765;
    }

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://web_backend;
            proxy_http_version 1.1;

            # Реальный IP клиента: uvicorn его читает (FORWARDED_ALLOW_IPS).
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket /ws/state: upgrade + длинный read timeout,
            # иначе nginx оборвёт простаивающее соединение через 60 с.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }
    }
}
