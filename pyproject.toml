[project]
name = "modbus-test-server"
version = "0.1.3"
description = "Modbus Sandbox - публичный тестовый Modbus-TCP сервер (modbus-sendbox.electroman.by)"
requires-python = ">=3.11"
dependencies = [
    "pymodbus>=3.7",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "websockets>=17.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    # starlette рекомендует неизвестный пакет httpx2; остаёмся на httpx (ADR-004)
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
strict = true
python_version = "3.11"
